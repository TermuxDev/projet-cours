spring.application.name=backend
server.port=8080
server.address=0.0.0.0

# Base de donnees SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=databasecours;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


spring.jpa.hibernate.ddl-auto=none
# Desactive la reecriture snake_case d'Hibernate : nos colonnes sont en camelCase exact
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS - origines autorisees a appeler l'API 
app.cors.origines-autorisees=http://localhost:4200,http://192.168.137.164:4200

# Envoi d'e-mails (codes de verification inscription / reinitialisation de mot de passe)
# Identifiants reels dans application-local.properties  (dans le dossier .gitignore, non suivis par GitHub)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.expediteur=${MAIL_USERNAME}

# Fichier local, hors suivi de version, qui fournit les vraies valeurs
spring.config.import=optional:classpath:application-local.properties
